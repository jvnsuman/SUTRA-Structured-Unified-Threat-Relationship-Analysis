[pytest]
# Third-party deprecation warnings we can't fix from our own code.
# Each filter is deliberately narrow (matches one message) so any *new*
# warning, especially ones from our own code, still shows up.
filterwarnings =
    # spaCy 3.7 (pinned in requirements.txt) imports split_arg_string from
    # click.parser; Click moved it to shell_completion. Goes away when the
    # spaCy pin is raised to a release that fixes the import.
    ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning
    # Older Starlette TestClient uses the deprecated anyio.abc alias.
    # Redundant once Starlette is upgraded; harmless to leave in.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    # Starlette's TestClient (used via fastapi.testclient) is nudging
    # toward a future `httpx2` backend; httpx itself still works fine.
    # Goes away once we migrate or Starlette drops the warning.
    ignore:Using \`httpx\` with \`starlette.testclient\` is deprecated:starlette.exceptions.StarletteDeprecationWarning